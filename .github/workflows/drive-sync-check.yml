name: Google Drive Full Sync Check

on:
  workflow_dispatch:
  push:
    branches:
      - feat/production-postgres

permissions:
  contents: read

concurrency:
  group: drive-sync-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drive-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qmrmed_drive_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d qmrmed_drive_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      BOT_TOKEN: ci-placeholder
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qmrmed_drive_ci
      TRIAL_ENABLED: false
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
      DRIVE_AUTO_APPROVE: true
      DRIVE_CHUNK_CHARS: 6000
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database schema
        run: npx prisma db push --skip-generate

      - name: Run full Google Drive sync
        run: npx tsx src/sync-drive.ts

      - name: Verify synchronized database
        run: npx tsx src/verify-drive-sync.ts
