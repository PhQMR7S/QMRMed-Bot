name: Google Drive Full Sync Check

on:
  workflow_dispatch:
  push:
    branches:
      - feature/admin-drive-panel

permissions:
  contents: read

concurrency:
  group: drive-sync-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drive-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOT_TOKEN: ci-placeholder
      DATABASE_URL: file:./drive-sync-check.db
      TRIAL_ENABLED: false
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
      DRIVE_AUTO_APPROVE: true
      DRIVE_CHUNK_CHARS: 6000
      DRIVE_MAX_FILE_MB: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database schema
        run: npx prisma db push --skip-generate

      - name: Run full Google Drive sync
        run: npx tsx src/sync-drive.ts

      - name: Verify synchronized database
        run: npx tsx src/verify-drive-sync.ts
