name: Trigger activation flow patch

on:
  push:
    paths:
      - '.github/workflows/dispatch-complete-manual-activation.yml'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch patch workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run complete-manual-activation.yml --repo "${{ github.repository }}" --ref feat/qmrmed-final-completion
