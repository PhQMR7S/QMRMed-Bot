name: One-time index syntax repair

on:
  push:
    branches:
      - feat/qmrmed-final-completion

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/qmrmed-final-completion
      - name: Repair malformed progress upsert and remove this workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()
          bad = "await db.progress.upsert({ where: { userId_lessonId: { userId: user.id, lessonId: Number(ctx.match[1]) }, create: { userId: user.id, lessonId: Number(ctx.match[1]), completed: true }, update: { completed: true } });"
          good = "await db.progress.upsert({ where: { userId_lessonId: { userId: user.id, lessonId: Number(ctx.match[1]) } }, create: { userId: user.id, lessonId: Number(ctx.match[1]), completed: true }, update: { completed: true } });"
          if bad not in s:
              raise SystemExit('expected malformed expression was not found')
          p.write_text(s.replace(bad, good, 1))
          PY
          rm .github/workflows/repair-index.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts .github/workflows/repair-index.yml
          git commit -m 'fix(bot): repair progress callback syntax'
          git push origin HEAD:feat/qmrmed-final-completion
