name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qmrmed_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d qmrmed_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      BOT_TOKEN: ci-placeholder
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qmrmed_ci
      TRIAL_ENABLED: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply database schema
        run: npx prisma db push --skip-generate
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
