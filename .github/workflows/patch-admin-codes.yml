name: Patch admin code UI
on:
  push:
    branches: [feat/qmrmed-final-completion]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.ts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()
          old = "import { backMenu, mainMenu, subjectMenu, topicMenu, lessonMenu, adminMenu, adminDriveMenu, studyDepartmentMenu, studyStageMenu, adminCodesMenu, plansMenu, externalPaymentMenu, cancelMenu } from './menu.js';"
          new = "import { backMenu, mainMenu, subjectMenu, topicMenu, lessonMenu, adminMenu, adminDriveMenu, studyDepartmentMenu, studyStageMenu, adminCodesMenu, adminCodeListMenu, adminCodeDetailMenu, plansMenu, externalPaymentMenu, cancelMenu } from './menu.js';"
          assert old in s
          s = s.replace(old, new, 1)
          old = "import { getAdminDashboard, getDriveStatus, runAdminDriveSync, getContentBreakdown } from './admin-panel.js';"
          new = "import { getAdminDashboard, getDriveStatus, runAdminDriveSync, getContentBreakdown, listActivationCodes, getActivationCode, setActivationCodeActive } from './admin-panel.js';"
          assert old in s
          s = s.replace(old, new, 1)
          old = "if (data === 'admin:codes') return render(ctx, '🎟️ إدارة أكواد الاشتراك\\n\\nاختر الخطة والمدة لإنشاء كود جديد. الكود لا يمنح أي صلاحيات أدمن؛ يمنح الاشتراك المحدد فقط.', adminCodesMenu());"
          new = "if (data === 'admin:codes') return render(ctx, '🎟️ إدارة أكواد الاشتراك\\n\\nاختر الخطة والمدة لإنشاء كود جديد، أو اعرض الأكواد الحالية لإدارتها.', adminCodesMenu());\n  if (data === 'admin:codes:list') { const codes = await listActivationCodes(20); if (!codes.length) return render(ctx, '📋 أكواد الاشتراك\\n\\nلا توجد أكواد منشأة حاليًا.', adminCodesMenu()); const now = new Date(); const lines = codes.map(c => `${c.active && (!c.expiresAt || c.expiresAt > now) && c.usedCount < c.maxUses ? '🟢' : '🔴'} #${c.id} — ${c.code} — ${c.plan} — ${c.durationDays} يوم — ${c.usedCount}/${c.maxUses}${c.expiresAt ? ` — ينتهي ${c.expiresAt.toLocaleDateString('ar-IQ')}` : ''}`); return render(ctx, `📋 أكواد الاشتراك\\n\\n${lines.join('\\n')}`, adminCodeListMenu(codes)); }\n  if (data.startsWith('admin:code:view:')) { const id = Number(data.split(':')[3]); if (!Number.isInteger(id) || id <= 0) return render(ctx, '❌ معرف كود غير صالح.', adminCodesMenu()); const code = await getActivationCode(id); if (!code) return render(ctx, '❌ الكود غير موجود.', adminCodesMenu()); const now = new Date(); const expired = !!code.expiresAt && code.expiresAt <= now; const exhausted = code.usedCount >= code.maxUses; const status = code.active && !expired && !exhausted ? '🟢 فعال' : expired ? '⏰ منتهي' : exhausted ? '🔴 مستنفد' : '⛔ معطل'; const redemptions = code.redemptions.length ? code.redemptions.map(r => `• ${r.user.username ? '@' + r.user.username : r.user.telegramId} — ${r.redeemedAt.toLocaleString('ar-IQ')}`).join('\\n') : 'لا يوجد استخدام حتى الآن.'; return render(ctx, `🎟️ تفاصيل الكود #${code.id}\\n\\n🔐 الكود: ${code.code}\\n💎 الخطة: ${code.plan}\\n📅 المدة: ${code.durationDays} يوم\\n📊 الاستخدام: ${code.usedCount}/${code.maxUses}\\n📌 الحالة: ${status}\\n📆 الإنشاء: ${code.createdAt.toLocaleString('ar-IQ')}\\n⏳ الانتهاء: ${code.expiresAt?.toLocaleString('ar-IQ') ?? 'غير محدد'}\\n👤 المنشئ: ${code.createdByTelegramId}\\n\\n👥 الاستخدامات:\\n${redemptions}`, adminCodeDetailMenu(id, code.active && !expired && !exhausted)); }\n  if (data.startsWith('admin:code:toggle:')) { const id = Number(data.split(':')[3]); if (!Number.isInteger(id) || id <= 0) return render(ctx, '❌ معرف كود غير صالح.', adminCodesMenu()); const code = await getActivationCode(id); if (!code) return render(ctx, '❌ الكود غير موجود.', adminCodesMenu()); const now = new Date(); const canEnable = !!code.expiresAt ? code.expiresAt > now && code.usedCount < code.maxUses : code.usedCount < code.maxUses; const nextActive = !code.active; if (nextActive && !canEnable) return render(ctx, '❌ لا يمكن تفعيل هذا الكود لأنه منتهي أو مستنفد.', adminCodeDetailMenu(id, false)); await setActivationCodeActive(id, nextActive); const updated = await getActivationCode(id); return render(ctx, `✅ تم ${nextActive ? 'تفعيل' : 'تعطيل'} الكود #${id}.`, adminCodeDetailMenu(id, !!updated?.active)); }"
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts
          git diff --cached --quiet || git commit -m 'feat(admin): wire activation code management'
          git push
