name: Apply pricing UI

on:
  push:
    branches: [feat/qmrmed-final-completion]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/qmrmed-final-completion
      - name: Update pricing flows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()

          def rep(old, new, name):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{name}: expected 1 match, got {n}')
              s = s.replace(old, new, 1)

          rep("bot.command('plans', async ctx => ctx.reply('💎 اشتراكات QMRMed\\n\\n🆓 FREE — التجربة المجانية مرة واحدة فقط.\\n💙 PLUS — اشتراك مدفوع.\\n💜 PRO — اشتراك مدفوع.\\n\\n💳 الدفع الرقمي داخل تيليجرام يتم عبر Telegram Stars فقط.\\n🎟️ ويمكن تفعيل أكواد اشتراك يمنحها الأدمن.', { reply_markup: plansMenu() }));", "bot.command('plans', async ctx => ctx.reply('💎 اشتراكات QMRMed\\n\\n🆓 FREE — التجربة المجانية مرة واحدة فقط.\\n\\n💙 PLUS: شهر 5$ | 5 أشهر 10$ | سنة 20$\\n💜 PRO: شهر 10$ | 5 أشهر 20$ | سنة 40$\\n\\n⭐ تقدير Stars: 100⭐ ≈ 2$؛ الأسعار المعروضة هي 250/500/1000/2000⭐ حسب المدة والخطة.\\n\\n⭐ الدفع الرقمي داخل تيليجرام يتم عبر Telegram Stars.', { reply_markup: plansMenu() }));", 'plans command')

          rep("bot.command('terms', async ctx => ctx.reply('📜 شروط الاستخدام\\n\\nاستخدام QMRMed تعليمي فقط. المحتوى لا يُعد تشخيصًا أو استشارة طبية شخصية.\\n\\nقبل شراء اشتراك مدفوع، يجب قراءة الشروط والموافقة عليها.', { reply_markup: new InlineKeyboard().text('💙 أوافق وأريد PLUS', 'terms:accept:PLUS').row().text('💜 أوافق وأريد PRO', 'terms:accept:PRO').row().text('⬅️ الرئيسية', 'home') }));", "bot.command('terms', async ctx => ctx.reply('📜 شروط الاستخدام\\n\\nاستخدام QMRMed تعليمي فقط. المحتوى لا يُعد تشخيصًا أو استشارة طبية شخصية.\\n\\nالدفع الرقمي داخل تيليجرام للاشتراكات يتم عبر Telegram Stars.\\n\\nقبل شراء اشتراك مدفوع، يجب قراءة الشروط والموافقة عليها.', { reply_markup: new InlineKeyboard().text('✅ أوافق على الشروط', 'terms:accept').row().text('⬅️ الاشتراك', 'plans').row().text('🏠 الرئيسية', 'home') }));", 'terms command')

          rep("bot.callbackQuery(/^plan:(PLUS|PRO)$/, async ctx => { await ctx.answerCallbackQuery(); const user = await getUser(ctx); if (!user.termsAcceptedAt) return render(ctx, '📜 قبل شراء الاشتراك يجب قراءة شروط الاستخدام والموافقة عليها.', new InlineKeyboard().text(`✅ أوافق وأتابع ${ctx.match[1]}`, `terms:accept:${ctx.match[1]}`).row().text('📜 الشروط', 'terms').row().text('⬅️ الاشتراك', 'plans')); try { await sendStarsInvoice(ctx, ctx.match[1] as 'PLUS' | 'PRO'); } catch (error) { return ctx.reply(`⚠️ ${error instanceof Error ? error.message : String(error)}\\n\\nيمكنك أيضًا استخدام كود اشتراك أو مراجعة طرق الدفع الأخرى.`, { reply_markup: plansMenu() }); } });", "bot.callbackQuery(/^plan:(PLUS|PRO):(30|150|365)$/, async ctx => { await ctx.answerCallbackQuery(); const user = await getUser(ctx); if (!user.termsAcceptedAt) return render(ctx, '📜 قبل شراء الاشتراك يجب قراءة شروط الاستخدام والموافقة عليها.', new InlineKeyboard().text('✅ أوافق على الشروط', 'terms:accept').row().text('📜 الشروط', 'terms').row().text('⬅️ الاشتراك', 'plans')); try { await sendStarsInvoice(ctx, ctx.match[1] as 'PLUS' | 'PRO', Number(ctx.match[2]) as 30 | 150 | 365); } catch (error) { return ctx.reply(`⚠️ ${error instanceof Error ? error.message : String(error)}\\n\\nيمكنك أيضًا استخدام كود اشتراك أو مراجعة طرق الدفع الأخرى.`, { reply_markup: plansMenu() }); } });", 'plan callback')

          rep("bot.callbackQuery(/^terms:accept:(PLUS|PRO)$/, async ctx => { await ctx.answerCallbackQuery('تم حفظ موافقتك'); const user = await getUser(ctx); await db.user.update({ where: { id: user.id }, data: { termsAcceptedAt: new Date() } }); try { await sendStarsInvoice(ctx, ctx.match[1] as 'PLUS' | 'PRO'); } catch (error) { return ctx.reply(`⚠️ ${error instanceof Error ? error.message : String(error)}`, { reply_markup: plansMenu() }); } });", "bot.callbackQuery('terms:accept', async ctx => { await ctx.answerCallbackQuery('تم حفظ موافقتك'); const user = await getUser(ctx); await db.user.update({ where: { id: user.id }, data: { termsAcceptedAt: new Date() } }); return render(ctx, '✅ تم حفظ موافقتك على الشروط. اختر الخطة والمدة الآن:', plansMenu()); });", 'terms accept')

          old = "bot.callbackQuery('payment_methods', async ctx => { await ctx.answerCallbackQuery(); return render(ctx, `💳 طرق الدفع\\n\\n⭐ Telegram Stars: طريقة الدفع الأساسية للاشتراكات الرقمية داخل تيليجرام.\\n\\n💳 Mastercard: ${config.MASTERCARD_ACCOUNT}\\n💰 Zain Cash: ${config.ZAINCASH_NUMBER}\\n🪙 العملات الرقمية: ${config.CRYPTO_PAYMENT_NOTE}\\n\\n⚠️ طرق Mastercard/Zain Cash/العملات الرقمية هي مسار يدوي/خارجي؛ لا يتم تفعيل الاشتراك بمجرد إرسال المبلغ. يجب التحقق من العملية ثم تفعيل الحساب بواسطة الأدمن.\\n\\n🚚 ${config.DELIVERY_NOTE}`, new InlineKeyboard().text('🎟️ تفعيل كود اشتراك', 'redeem_code').row().text('🆘 دعم الدفع', 'paysupport').row().text('⬅️ الاشتراك', 'plans')); });"
          new = "bot.callbackQuery('payment_methods', async ctx => { await ctx.answerCallbackQuery(); return render(ctx, `💳 طرق الدفع\\n\\n⭐ Telegram Stars: الدفع الأساسي للاشتراكات الرقمية داخل تيليجرام.\\n\\n💳 Mastercard: ${config.MASTERCARD_ACCOUNT}\\n💰 Zain Cash: ${config.ZAINCASH_NUMBER}\\n🪙 العملات الرقمية عبر محفظة Telegram: قريبًا.\\n\\nℹ️ Mastercard وZain Cash مساران خارجيان/يدويان؛ لا يتم تفعيل الاشتراك تلقائيًا بمجرد إرسال المبلغ، بل بعد التحقق والتفعيل من الأدمن.`, new InlineKeyboard().text('🎟️ تفعيل كود اشتراك', 'redeem_code').row().text('🆘 دعم الدفع', 'paysupport').row().text('⬅️ الاشتراك', 'plans')); });"
          rep(old, new, 'payment methods')

          rep("return ctx.reply(`🎉 تم الدفع بنجاح عبر Telegram Stars.\\n\\n💎 الخطة: ${result.plan}\\n✅ تم تفعيل الاشتراك على حسابك.`, { reply_markup: plansMenu() });", "return ctx.reply(`🎉 تم الدفع بنجاح عبر Telegram Stars.\\n\\n💎 الخطة: ${result.plan}\\n📅 المدة: ${result.days === 30 ? 'شهر واحد' : result.days === 150 ? '5 أشهر' : 'سنة واحدة'}\\n⭐ النجوم المدفوعة: ${payment.total_amount}\\n✅ تم تفعيل الاشتراك على حسابك.`, { reply_markup: plansMenu() });", 'payment success')

          p.write_text(s)
          PY
          rm .github/workflows/fix-pricing-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts .github/workflows/fix-pricing-ui.yml
          git commit -m 'feat(pricing): add duration choices and correct payment methods'
          git push origin HEAD:feat/qmrmed-final-completion
