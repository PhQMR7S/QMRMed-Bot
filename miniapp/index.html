<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <meta name="color-scheme" content="dark" />
  <title>QMRMed</title>

</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button class="icon-btn top-action" data-action="back" aria-label="رجوع"><span class="svg-icon">‹</span></button>
      <div class="brand" data-go="home"><div class="brand-mark"><span class="svg-icon">✚</span></div><div class="brand-copy"><strong>QMRMed</strong><span>For a Smarter Medical Future</span></div></div>
      <button class="icon-btn top-action" data-action="menu" aria-label="المزيد"><span class="svg-icon">☰</span></button>

    <main id="view" class="view" aria-live="polite"><div class="loading"><div class="spinner"></div><span>جارٍ تحميل حسابك…</span></div></main>
    <nav class="bottom-nav" aria-label="التنقل الرئيسي">
      <button data-route="home" class="nav-item active"><span class="nav-icon svg-icon">⌂</span><small>الرئيسية</small></button>
      <button data-route="plans" class="nav-item"><span class="nav-icon svg-icon">♛</span><small>الاشتراك</small></button>
      <button data-route="archive" class="nav-item"><span class="nav-icon">▣</span><small>الأرشيف</small></button>
      <button data-route="account" class="nav-item"><span class="nav-icon">●</span><small>حسابي</small></button>
      <button data-route="menu" class="nav-item"><span class="nav-icon">☰</span><small>المزيد</small></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="/miniapp/runtime.js?v=20260911-4"></script>

</html>
